<div class="mx-auto max-w-7xl p-4">
  <header class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-2xl font-bold text-slate-800">Lista de Tarefas</h1>
    <button type="button" class="btn-primary" (click)="novaTarefa()">+ Nova tarefa</button>
  </header>

  <section class="filter-panel">
    <label class="field-label">
      Status
      <select class="field-select" [(ngModel)]="filtroStatus">
        <option value="">Todos</option>
        @for (c of colunas; track c.status) {
          <option [value]="c.status">{{ c.titulo }}</option>
        }
      </select>
    </label>
    <label class="field-label">
      Vencimento de
      <input type="date" class="field-control" [(ngModel)]="filtroDe" />
    </label>
    <label class="field-label">
      Vencimento até
      <input type="date" class="field-control" [(ngModel)]="filtroAte" />
    </label>
    <button type="button" class="btn-dark" (click)="carregar()">Filtrar</button>
    <button type="button" class="btn-ghost" (click)="limparFiltros()">Limpar</button>
  </section>

  @if (mensagem()) {
    <p class="alert-error" role="alert">{{ mensagem() }}</p>
  }
  @if (carregando()) {
    <p class="mb-3 text-sm text-slate-500">Carregando...</p>
  }

  <div cdkDropListGroup class="grid grid-cols-1 gap-4 md:grid-cols-3">
    @for (coluna of colunas; track coluna.status) {
      <section class="board-column" [class]="coluna.corBorda">
        <h2 class="mb-3 flex items-center justify-between font-semibold text-slate-700">
          {{ coluna.titulo }}
          <span class="column-badge" [class]="coluna.corBadge">{{ porColuna().get(coluna.status)?.length }}</span>
        </h2>
        <div
          cdkDropList
          [cdkDropListData]="coluna.status"
          (cdkDropListDropped)="soltar($event)"
          class="flex min-h-24 flex-1 flex-col gap-2"
        >
          @for (t of porColuna().get(coluna.status); track t.id) {
            <div cdkDrag [cdkDragData]="t" class="cursor-grab active:cursor-grabbing">
              <app-task-card
                [tarefa]="t"
                (statusChange)="moverPara(t, $event)"
                (editar)="editar($event)"
                (excluir)="excluir($event)"
              />
            </div>
          }
        </div>
      </section>
    }
  </div>
</div>

@if (dialogAberto()) {
  <app-task-form-dialog [tarefa]="editando()" [erro]="erroForm()" (salvou)="salvar($event)" (cancelar)="fecharDialog()" />
}
